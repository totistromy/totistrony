<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toti Strona - Nowoczesne Strony Internetowe</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); position: fixed; top: 0; left: 0; width: 100%; border-bottom: 1px solid #334155; z-index: 100; }
        .nav-container { max-width: 1100px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        .hero { padding: 8rem 2rem 5rem; text-align: center; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .hero p { color: var(--text-muted); font-size: 1.15rem; margin-bottom: 2rem; }
        .btn { display: inline-block; background: var(--primary); color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; }
        section { padding: 4rem 2rem; max-width: 900px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 1rem; padding: 2.5rem; }
        h2 { font-size: 2rem; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-muted); }
        input, textarea { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
        textarea { resize: vertical; height: 120px; }
        button[type="submit"] { width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        footer { text-align: center; padding: 2rem; color: var(--text-muted); border-top: 1px solid #334155; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="#" class="logo">TotiStrona</a>
            <a href="#kontakt" class="btn" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Kontakt</a>
        </div>
    </header>
    <main>
        <div class="hero">
            <h1>Tworzymy Nowoczesne Strony Internetowe</h1>
            <p>Zbuduj swoją obecność w sieci dzięki szybkim i profesjonalnym witrynom dopasowanym do Twojego biznesu.</p>
            <a href="#kontakt" class="btn">Zamów projekt</a>
        </div>
        <section id="kontakt">
            <div class="card">
                <h2>Złóż zapytanie</h2>
                <form action="https://api.web3forms.com/submit" method="POST">
                    <input type="hidden" name="access_key" value="003d3d3e-9b83-4aae-83cb-93b584eb25e4">
                    <input type="hidden" name="subject" value="Nowe zapytanie z TotiStrona!">
                    <div class="form-group">
                        <label for="name">Imię i nazwisko</label>
                        <input type="text" id="name" name="name" required placeholder="Wpisz swoje imię...">
                    </div>
                    <div class="form-group">
                        <label for="email">Adres E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="twoj@email.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Opis projektu / Wiadomość</label>
                        <textarea id="message" name="message" required placeholder="Opisz, jakiej strony potrzebujesz..."></textarea>
                    </div>
                    <button type="submit">Wyślij zapytanie</button>
                </form>
            </div>
        </section>
        </footer>
</body>
</html>

    
  

</html>
